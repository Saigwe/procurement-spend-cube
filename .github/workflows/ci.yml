name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [usaspending, erp_sap, erp_oracle]
    name: build (${{ matrix.client }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fixture pipeline for one client adapter (synthetic extract -> dbt seed + build with tests)
        run: make fixture-all CLIENT=${{ matrix.client }}
