# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 1010
tables:
  - name: suppliers
    rows: 300
    pk: supplier_id
    columns:
      supplier_id: {type: id, prefix: SUP}
      supplier_name: {type: id, prefix: "Supplier "}
      country_code: {type: choice, values: [US, GB, DE, IN], p: [0.6, 0.2, 0.1, 0.1]}
  - name: taxonomy_rules
    pk: keyword
    data:
      columns: [keyword, category, sub_category]
      rows:
        - [laptop, IT, Hardware]
        - [cloud, IT, Cloud services]
        - [software, IT, Software]
        - [consulting, Professional services, Consulting]
        - [courier, Logistics, Courier]
        - [chairs, Facilities, Furniture]
        - [cleaning, Facilities, Cleaning]
        - [toner, Office, Supplies]
  - name: spend_lines
    rows: 8000
    pk: line_id
    fk: {supplier_id: suppliers.supplier_id}
    cast: {invoice_date: date, paid_date: date}
    columns:
      line_id: {type: id, prefix: L, width: 7}
      supplier_id: {type: expr, expr: "rng.choice(tables['suppliers'].supplier_id.to_numpy(), n, p=(lambda w: w / w.sum())(rng.pareto(1.2, len(tables['suppliers'])) + 1))"}
      description: {type: choice, values: [laptop purchase, office chairs, cloud hosting, consulting services, courier delivery, printer toner, software licence renewal, facility cleaning]}
      invoice_date: {type: date, start: 2024-07-01, end: 2025-06-30}
      amount_usd: {type: float, dist: lognormal, mean: 7.0, sigma: 1.4}
      payment_terms_days: {type: choice, values: [30, 45, 60, 90], p: [0.4, 0.3, 0.2, 0.1]}
      paid_date: {type: expr, expr: "df.invoice_date + pd.to_timedelta(df.payment_terms_days.to_numpy() + rng.integers(-10, 25, n), unit='D')"}
